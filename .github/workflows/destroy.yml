name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Terraform root to destroy"
        required: true
        type: choice
        options:
          - main
          - foundation
      confirm_destroy:
        description: "Type destroy to confirm"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true

concurrency:
  group: ronin-infrastructure
  cancel-in-progress: false

jobs:
  main:
    name: Destroy Main
    if: ${{ inputs.target == 'main' && inputs.confirm_destroy == 'destroy' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve

  foundation:
    name: Destroy Foundation
    if: ${{ inputs.target == 'foundation' && inputs.confirm_destroy == 'destroy' }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    defaults:
      run:
        working-directory: infra/foundation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

