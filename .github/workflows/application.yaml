name: Application Workflow

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/build-image.sh"
      - "scripts/check-container.sh"
      - "scripts/deploy-ecs.sh"
      - "scripts/push-image-to-ecr.sh"
      - "scripts/verify-app-health.sh"
      - ".github/workflows/application.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/build-image.sh"
      - "scripts/check-container.sh"
      - "scripts/deploy-ecs.sh"
      - "scripts/push-image-to-ecr.sh"
      - "scripts/verify-app-health.sh"
      - ".github/workflows/application.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the application action to perform"
        type: choice
        required: true
        options:
          - scan-only
          - deploy

permissions:
  contents: read

concurrency:
  group: ronin-${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') && 'deployment' || github.run_id }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  LOCAL_IMAGE: ronin:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: bash scripts/build-image.sh "$LOCAL_IMAGE"

      - name: Verify container health
        run: bash scripts/check-container.sh "$LOCAL_IMAGE"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Configure AWS Credentials
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR repository
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Push scanned image to ECR
        id: push
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/ronin
        run: bash scripts/push-image-to-ecr.sh "$LOCAL_IMAGE" "$REPOSITORY" "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Verify RONIN deployment
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/ronin
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
        run: bash scripts/deploy-ecs.sh "$REPOSITORY" "$EXPECTED_DIGEST"
