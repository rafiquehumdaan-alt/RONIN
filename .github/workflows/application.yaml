name: Application Workflow

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/application.yaml"

  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/application.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the application action"
        type: choice
        required: true
        default: scan-only
        options:
          - scan-only
          - deploy

permissions:
  contents: read

concurrency:
  group: ronin-${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') && 'deployment' || github.run_id }}
  cancel-in-progress: false

env:
  LOCAL_IMAGE: ronin:${{ github.sha }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'scan-only'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and test image
        run: |
          bash scripts/build-image.sh "$LOCAL_IMAGE"
          bash scripts/check-container.sh "$LOCAL_IMAGE"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and test image
        run: |
          bash scripts/build-image.sh "$LOCAL_IMAGE"
          bash scripts/check-container.sh "$LOCAL_IMAGE"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Push image and roll out to ECS
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/ronin
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy-ecs.sh "$LOCAL_IMAGE" "$REPOSITORY" "$IMAGE_TAG"