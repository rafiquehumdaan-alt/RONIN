name: Terraform Workflow

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: ronin-${{ github.event_name == 'workflow_dispatch' && 'deployment' || github.run_id }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Initialise providers
        run: terraform init -backend=false -input=false

      - name: Validate Main
        run: terraform validate

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  main:
    if: github.event_name == 'workflow_dispatch'
    needs: terraform-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialise Main backend
        run: terraform init -input=false

      - name: Check for an application image
        if: inputs.action != 'destroy'
        id: image
        run: bash ../scripts/check-ecr-image.sh

      - name: Plan Main
        if: inputs.action != 'destroy' && steps.image.outputs.exists == 'true'
        run: terraform plan -input=false -out=tfplan

      - name: Plan ECR before the first image push
        if: inputs.action != 'destroy' && steps.image.outputs.exists == 'false'
        run: terraform plan -input=false -target=aws_ecr_repository.ronin -out=tfplan

      - name: Plan destroy
        if: inputs.action == 'destroy'
        run: terraform plan -input=false -destroy -out=tfplan

      - name: Apply saved plan
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
        run: terraform apply -input=false tfplan

      - name: Wait for ECS service
        if: inputs.action == 'apply' && steps.image.outputs.exists == 'true'
        run: aws ecs wait services-stable --cluster ronin-cluster --services ronin-service

      - name: Verify public health
        if: inputs.action == 'apply' && steps.image.outputs.exists == 'true'
        run: bash ../scripts/verify-app-health.sh https://ronin.humdaan.co.uk/health 15
