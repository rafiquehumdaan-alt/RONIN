name: App Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "run.py"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: ronin

jobs:
  build-check-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::435059220418:role/ronin-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${GITHUB_SHA} \
            .

      - name: Check container health
        run: |
          docker run --detach \
            --name ronin-health-check \
            --publish 8080:8080 \
            $ECR_REPOSITORY:${GITHUB_SHA}

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "RONIN container health check passed."
              docker rm --force ronin-health-check
              exit 0
            fi

            echo "Health check attempt $attempt failed. Retrying in 2 seconds..."
            sleep 2
          done

          echo "RONIN container health check failed."
          docker logs ronin-health-check
          docker rm --force ronin-health-check
          exit 1

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            $ECR_REPOSITORY:${GITHUB_SHA} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

          docker tag \
            $ECR_REPOSITORY:${GITHUB_SHA} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest
